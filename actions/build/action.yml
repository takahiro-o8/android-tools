name: Production APK build
description: Build only one signed production APK on main and retain three releases.
inputs:
  app-name:
    description: APK display name
    required: true
  module:
    description: Application Gradle module
    default: app
  key-alias:
    description: Fixed signing alias
    required: true
  keystore-base64:
    description: Existing production signing key, encoded as Base64
    required: false
    default: ''
  keystore-file:
    description: Repository-local, password-protected PKCS12/JKS signing file (alternative to Base64)
    default: ''
  keystore-password:
    description: Keystore password
    required: true
  key-password:
    description: Optional separate key password
    default: ''
  expected-certificate:
    description: Optional SHA-256 fingerprint of installed signing certificate
    default: ''
  expected-certificate-file:
    description: Optional path to pinned SHA-256 certificate digest
    default: ''
  signing-mode:
    description: properties or env
    default: properties
runs:
  using: composite
  steps:
    - name: Validate signing configuration before provisioning Android
      shell: bash
      env:
        EXISTING_KEY: ${{ inputs.keystore-base64 }}
        EXISTING_KEY_FILE: ${{ inputs.keystore-file }}
        EXISTING_PASSWORD: ${{ inputs.keystore-password }}
        EXISTING_ALIAS: ${{ inputs.key-alias }}
      run: |
        if [ -z "$EXISTING_PASSWORD" ] || [ -z "$EXISTING_ALIAS" ]; then
          echo "::error::Signing password or alias missing. Register the app's own signing secret."
          exit 1
        fi
        if [ -n "$EXISTING_KEY_FILE" ]; then
          if [ ! -s "$EXISTING_KEY_FILE" ]; then
            echo "::error::The encrypted signing file is missing. For File, use Run workflow -> Initialize new signing key once."
            exit 1
          fi
        elif [ -z "$EXISTING_KEY" ]; then
          echo "::error::Existing Android signing keystore is missing. Reuse the established key, or explicitly bootstrap a new key if reinstall is approved."
          exit 1
        fi
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.9.1'
    - shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        MODULE: ${{ inputs.module }}
        KEY_ALIAS: ${{ inputs.key-alias }}
        KEYSTORE_BASE64: ${{ inputs.keystore-base64 }}
        KEYSTORE_FILE_PATH: ${{ inputs.keystore-file }}
        KEYSTORE_PASSWORD: ${{ inputs.keystore-password }}
        KEY_PASSWORD: ${{ inputs.key-password }}
        SIGNING_MODE: ${{ inputs.signing-mode }}
        EXPECTED_CERT: ${{ inputs.expected-certificate }}
        EXPECTED_CERT_FILE: ${{ inputs.expected-certificate-file }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: bash "${{ github.action_path }}/build.sh"
