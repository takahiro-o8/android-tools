# Copy this file to an app's .github/workflows/build.yml and customize APP_* placeholders.
# One push to main -> one verified, signed production APK Release. No dev/draft/diagnostic Releases.
# Configure APP_KEYSTORE_BASE64 and APP_KEYSTORE_PASSWORD in THIS APP's GitHub Secrets once.
name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/android-tools
          path: .android-tools
      - uses: ./.android-tools/actions/build
        with:
          app-name: APP_NAME
          key-alias: APP_KEY_ALIAS
          keystore-base64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          key-password: ${{ secrets.APP_KEY_PASSWORD }}
          # Set an existing app's previously approved certificate fingerprint:
          # expected-certificate: 64_lowercase_hex_digits
